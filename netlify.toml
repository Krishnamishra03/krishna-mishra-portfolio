# Netlify deployment config for this TanStack Start app.
# Nitro auto-detects Netlify (via the NETLIFY env var) and, with NITRO_PRESET
# pinned below, emits the SSR handler to .netlify/ and static assets to dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
NODE_VERSION = "22"
NITRO_PRESET = "netlify"
# Nitro's Netlify preset auto-generates the SSR function under
# .netlify/functions-internal/, so do NOT set a custom functions directory.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images/PDFs live on Lovable's asset CDN and are referenced as /__l5e/assets-v1/*.
# Netlify has no such route, so proxy those requests to the Lovable-hosted origin.
[[redirects]]
  from = "/__l5e/*"
  to = "https://krishna-mishra-portfolio.lovable.app/__l5e/:splat"
  status = 200
  force = true
