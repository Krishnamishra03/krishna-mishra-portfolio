# Netlify deployment config for this TanStack Start app.
# Nitro auto-detects Netlify (via the NETLIFY env var) and, with NITRO_PRESET
# pinned below, emits the SSR handler to .netlify/ and static assets to dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
